; Lunch Money budgets on ESP32 display boards

[platformio]
default_envs = 8048s043

[env:common]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/disable_lvgl_helium.py
build_flags =
    -I include
    -D LV_CONF_PATH=${PROJECT_SRC_DIR}/lv_conf.h
    -D LV_USE_DRAW_SW_ASM=0
    -D LV_USE_NATIVE_HELIUM_ASM=0

; 4.3" ESP32-8048S043C — 800x480 RGB, GT911 touch (box: ES32-8048S043C_I)
[env:8048s043]
extends = env:common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
lib_deps =
    file:///Users/broz/src/ESP32-8048S043-4INCH-LCD/1-Demo/Demo_Arduino/Libraries/Arduino_GFX-master
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@^7.4.2
    https://github.com/TAMCTec/gt911-arduino.git
build_flags =
    ${env:common.build_flags}
    -DBOARD_8048S043
    -DBOARD_HAS_PSRAM
    -D TOUCH_DEBUG=0
build_src_filter = +<*> -<touch_input.cpp>
